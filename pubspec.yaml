name: trybase
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  sizer: ^2.0.15               # Required for responsive design system
  flutter_svg: ^2.0.9          # Required for SVG icon support
  google_fonts: ^6.1.0         # Required for typography (replaces local fonts)
  shared_preferences: ^2.2.2   # Required for local data storage
  local_auth: ^2.1.7
  flutter_secure_storage: ^8.0.0

  # Firebase dependencies
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0

  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  flutter_slidable: ^4.0.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  http: ^1.2.0
  http_parser: ^4.0.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/data/
fonts:
  - family: Roboto
    fonts:
      - asset: assets/font/BodoniModa-Italic-VariableFont_opsz,wght.ttf
        weight: 700
      